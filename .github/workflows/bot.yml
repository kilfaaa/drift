name: Прогноз и бот

on:
  schedule:
    - cron: "7 9 * * *"    # 12:07 МСК — прогноз на вечер, опрос, журнал
    - cron: "7 15 * * *"   # 18:07 МСК — уточнение на вечер
    - cron: "37 4 * * *"   # 07:37 МСК — собрать голоса
    - cron: "37 20 * * *"  # 23:37 МСК — собрать голоса
  push:
    branches: [main]
    paths: ["crew/vault.json", "bot/**", ".github/workflows/bot.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        type: choice
        default: auto
        options: [auto, noon, evening, collect, calibrate, test]

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography==43.0.3
      - name: Бот
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CREW_BOT_CODE: ${{ secrets.CREW_BOT_CODE }}
        run: python bot/run.py --mode "${{ inputs.mode || 'auto' }}"
      - name: Сохранить журнал и статистику
        run: |
          git config user.name "medvedovka-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/state.json crew/stats.json data/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "бот: прогноз, журнал, статистика"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
